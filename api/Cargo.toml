[package]
name = "finlora-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
ort = "2.0.0-rc.13"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio-test = "0.4.5"
tower-test = "0.4.0"
